<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'">
    <title>IsideHasher</title>
    <link rel="stylesheet" href="vendor/fontawesome/css/fontawesome.min.css">
    <link rel="stylesheet" href="vendor/fontawesome/css/solid.min.css">
    <link rel="stylesheet" href="vendor/bulma/css/bulma.min.css">
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
<section class="section">
    <div class="container">

        <div class="columns">
            <div class="column is-half">
                <h1 class="title has-text-link">
                    <b>IsideHasher</b>
                </h1>
                <p class="subtitle has-text-link">
                    File Hasher (MDx, SHAx, RIPEMD160)
                </p>
            </div>
            <div class="column">
                <div class="columns">
                    <div class="column">
                        <div class="select is-primary">
                            <select id="hashalgorithm">
                                <option value="-">Select algorithm</option>
                                <option value="md4">MD4</option>
                                <option value="md5">MD5</option>
                                <option value="ripemd160">RIPEMD160</option>
                                <option value="sha1">SHA1</option>
                                <option value="sha224">SHA224</option>
                                <option value="sha256">SHA256</option>
                                <option value="sha384">SHA384</option>
                                <option value="sha512">SHA512</option>
                            </select>
                        </div>
                    </div>
                    <div class="column">
                        <div class="select is-primary is-flex-direction-column is-flex">
                            <select id="hashmode">
                                <option value="text">Text Mode</option>
                                <option value="file" selected>File Mode</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="filemode">
            <form class="hashinput">
                <div class="columns">
                    <div class="column is-three-quarters">
                        <input id="filepathcontrol"
                               class="input is-primary" type="text" placeholder="File path..." readonly>
                    </div>
                    <div class="column">
                        <div class="file">
                            <label class="file-label">
                                <input id="fileinputcontrol" class="file-input" type="file"
                                       name="fileinputcontrol">
                                <span class="file-cta">
                               <span class="file-icon">
                                <i class="fas fa-upload"></i>
                              </span>
                              <span class="file-label">
                                Choose a file…
                              </span>
                            </span>
                            </label>
                        </div>
                    </div>
                    <div class="column">&nbsp;</div>
                </div>
            </form>
        </div>

        <div id="textmode" class="is-hidden">
            <form class="hashinput">
                <input id="text2hash" class="input is-primary" placeholder="Text to hash..." type="text" >
            </form>
        </div>


        <textarea id="hashdisplay"
                  class="textarea is-primary"
                  placeholder="Hash code..." readonly></textarea>

        <div class="buttons mt-5">
            <button id="computehash" class="button is-primary" disabled>Compute Hash</button>
            <button id="copyhash" class="button is-info" disabled>
                <span class="icon"><i class="fas fa-copy"></i></span>
                <span id="copyhashlabel">Copy Hash</span>
            </button>
            <button id="quitme" class="button is-link">Quit</button>
            <button id="aboutbutton" class="button is-small is-light ml-auto" title="About">
                <span class="icon"><i class="fas fa-info-circle"></i></span>
                <span>About</span>
            </button>
        </div>


    </div>
</section>

<div id="aboutmodal" class="modal">
    <div class="modal-background"></div>
    <div class="modal-card about-card">
        <section class="modal-card-body has-text-centered">
            <p class="title is-4 has-text-link">Iside Hasher</p>
            <p class="subtitle is-6">v.<span id="aboutversion"></span></p>
            <p>by LittleLite Software</p>
            <p class="mt-2">
                GitHub: <a id="aboutgithub" href="#">https://github.com/guildenstern70/IsideHasher</a>
            </p>
        </section>
        <footer class="modal-card-foot is-justify-content-center">
            <button id="aboutok" class="button is-primary">OK</button>
        </footer>
    </div>
</div>
<script src="./renderer.js"></script>
</body>
</html>
